name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install portaudio cmake

      - name: Build VoxType
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu)

      - name: Download models
        run: |
          mkdir -p models
          # Download accurate model (small.en)
          curl -L -o models/ggml-small.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en.bin
          # Download balanced model (base.en)
          curl -L -o models/ggml-base.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin

      - name: Create app bundle
        run: |
          chmod +x scripts/create-app-bundle.sh
          ./scripts/create-app-bundle.sh

      - name: Create DMG
        run: |
          chmod +x scripts/create-dmg.sh
          ./scripts/create-dmg.sh

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Rename DMG with version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mv build/VoxType-Installer.dmg build/VoxType-${VERSION}-macOS.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxType-macOS
          path: build/VoxType-*.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/VoxType-*.dmg
          generate_release_notes: true
          body: |
            ## VoxType ${{ steps.version.outputs.version }}

            **Voice-to-text that just works.** Hold a key, speak, release - your words appear wherever your cursor is.

            ### Installation

            1. Download `VoxType-${{ steps.version.outputs.version }}-macOS.dmg` below
            2. Open the DMG and drag VoxType to Applications
            3. Open VoxType from Applications
            4. Grant Accessibility permissions when prompted
            5. Hold Right Option key to record, release to transcribe

            ### Requirements

            - macOS 11+ (Big Sur or later)
            - Apple Silicon (M1/M2/M3) or Intel Mac

            ### What's Included

            - Pre-bundled AI models (no download required)
            - Metal GPU acceleration for fast transcription
            - ~560 MB download

            ---

            100% local, 100% private. No internet required after installation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build for Intel Macs
  build-macos-intel:
    runs-on: macos-13  # Intel runner
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install portaudio cmake

      - name: Build VoxType
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu)

      - name: Download models
        run: |
          mkdir -p models
          curl -L -o models/ggml-small.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en.bin
          curl -L -o models/ggml-base.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin

      - name: Create app bundle
        run: |
          chmod +x scripts/create-app-bundle.sh
          ./scripts/create-app-bundle.sh

      - name: Create DMG
        run: |
          chmod +x scripts/create-dmg.sh
          ./scripts/create-dmg.sh

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename DMG with version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mv build/VoxType-Installer.dmg build/VoxType-${VERSION}-macOS-Intel.dmg

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/VoxType-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
