name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install portaudio cmake

      - name: Build VoxType
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu)

      - name: Run tests
        run: |
          cd tests
          chmod +x run_tests.sh
          ./run_tests.sh

      - name: Verify binary
        run: |
          ./build/voxtype --help || true
          ls -la build/voxtype
